<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cue 追分 · 小程序头像方案</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#F4F2EE;color:#16161A;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:56px 40px 80px}
h1{font-size:34px;font-weight:800;letter-spacing:-.3px}
.sub{color:#6B6B73;font-size:14px;margin-top:8px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:36px}
.card{background:#fff;border-radius:26px;padding:20px;box-shadow:0 12px 30px -18px rgba(60,40,20,.25);display:flex;flex-direction:column;gap:14px;transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -18px rgba(60,40,20,.35)}
.top{display:flex;align-items:baseline;gap:8px}
.top i{font:800 12px ui-monospace,Menlo,monospace;font-style:normal;color:#fff;background:#16161A;border-radius:7px;padding:2px 7px}
.top b{font-size:16px;font-weight:800}
.desc{font-size:12px;color:#8A8A92;line-height:1.5;min-height:36px}
.pv{display:flex;align-items:flex-end;gap:14px}
.sq{width:144px;height:144px;border-radius:22px;overflow:hidden;flex:none;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.sq svg,.ci svg,.mi svg,.row svg{display:block;width:100%;height:100%}
.side{display:flex;flex-direction:column;align-items:center;gap:10px}
.ci{width:72px;height:72px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.mi{width:32px;height:32px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.side small{font-size:10px;color:#A9A9B0}
.dl{height:34px;border-radius:17px;background:#F0EEE9;font-size:13px;font-weight:700;border:0;cursor:pointer;color:#16161A}
.dl:hover{background:#16161A;color:#fff}
.mock{margin-top:44px;background:#fff;border-radius:26px;padding:22px 24px;box-shadow:0 12px 30px -18px rgba(60,40,20,.25)}
.mock h3{font-size:15px;font-weight:800}
.mock p{font-size:12px;color:#8A8A92;margin-top:4px}
.rows{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:18px}
.rw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#6B6B73}
.row{width:52px;height:52px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.dark{background:#111114;margin-top:12px}
.dark .rw{color:#9D9DA5}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.rows{grid-template-columns:repeat(6,1fr)}}
body.export{background:transparent}
body.export .wrap{display:none}
#exp{display:none}
body.export #exp{display:block;width:144px;height:144px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cue 追分 · 小程序头像方案</h1>
  <p class="sub">12 个风格，均按 144 × 144 px 绘制。小程序头像在微信里多数位置显示为<b>圆形</b>，所以主体都放在圆形安全区内。<br>每张卡片：左边是 1:1 实际尺寸，右边是圆形裁切和 32px 小尺寸效果；点「下载 PNG」可直接下载 144 × 144 原图。</p>
  <div class="grid" id="grid"></div>
  <div class="mock"><h3>真实场景预览 · 微信下拉「最近使用的小程序」</h3><p>实际显示约 48–52px 圆形，看哪个在小尺寸下依然清晰、好认</p>
    <div class="rows" id="rows"></div></div>
  <div class="mock dark"><div class="rows" id="rowsD"></div></div>
</div>
<div id="exp"></div>
<script>
/* 每个头像 = 一个返回 SVG 字符串的函数（id 前缀避免冲突） */
const R='ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",-apple-system,"PingFang SC",sans-serif';
const H='-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
function pixelBall(){
  const n=18,s=8;let o='';const c=8.5;
  const nine=['111','101','111','001','111'];
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const d=Math.hypot(i-c,j-c);let col=null;
    if(d<6.3)col=(j>=6&&j<=11)?'#FFC21A':'#FFF8EC';
    else if(d<7.3)col='#16161A';
    if(d<2.6&&col)col='#FFFFFF';
    if(col)o+=`<rect x="${i*s}" y="${j*s}" width="${s}" height="${s}" fill="${col}"/>`;
  }
  nine.forEach((r,y)=>[...r].forEach((b,x)=>{if(b==='1')o+=`<rect x="${(7.5+x)*s}" y="${(6.5+y)*s}" width="${s}" height="${s}" fill="#16161A"/>`}));
  o+=`<rect x="${4*s}" y="${4*s}" width="${s}" height="${s}" fill="#fff" opacity=".9"/><rect x="${5*s}" y="${3*s}" width="${s}" height="${s}" fill="#fff" opacity=".7"/>`;
  return o;
}
const LOGOS=[
 {n:'拟物九号球',d:'经典 9 号球，带高光与阴影，一眼认出是台球',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg"><defs>
  <linearGradient id="${p}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A6B"/><stop offset="1" stop-color="#FF4458"/></linearGradient>
  <radialGradient id="${p}b" cx=".38" cy=".32" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>
  <clipPath id="${p}c"><circle cx="72" cy="68" r="44"/></clipPath></defs>
  <rect width="144" height="144" fill="url(#${p}a)"/>
  <ellipse cx="75" cy="118" rx="34" ry="6.5" fill="#7A0F1E" opacity=".3"/>
  <g clip-path="url(#${p}c)"><rect x="20" y="20" width="104" height="104" fill="#FBF8F1"/><path d="M20 47 Q72 37 124 47 L124 90 Q72 100 20 90Z" fill="#FFC21A"/></g>
  <circle cx="72" cy="68" r="44" fill="url(#${p}b)"/>
  <circle cx="72" cy="68" r="16.5" fill="#fff"/><text x="72" y="76" text-anchor="middle" font-size="22" font-weight="900" font-family='${R}' fill="#16161A">9</text>
  <ellipse cx="55" cy="45" rx="12" ry="6.5" fill="#fff" opacity=".8" transform="rotate(-32 55 45)"/></svg>`},
 {n:'多巴胺四色',d:'品牌四色拼成一颗球，和 App 内图标统一',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <rect width="144" height="144" fill="#FFF4E6"/>
  <path d="M72 72V22A50 50 0 0 1 122 72Z" fill="#FF5A5F"/><path d="M72 72H122A50 50 0 0 1 72 122Z" fill="#3D7BFF"/>
  <path d="M72 72V122A50 50 0 0 1 22 72Z" fill="#1FC98E"/><path d="M72 72H22A50 50 0 0 1 72 22Z" fill="#FFC53D"/>
  <circle cx="72" cy="72" r="22" fill="#fff"/><text x="72" y="81" text-anchor="middle" font-size="25" font-weight="900" font-family='${H}' fill="#16161A">追</text></svg>`},
 {n:'汉字「追」',d:'大字标，中文用户最好认；右上角一颗 9 号球点题',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg"><defs>
  <linearGradient id="${p}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4D8BFF"/><stop offset="1" stop-color="#7B5CFF"/></linearGradient></defs>
  <rect width="144" height="144" fill="url(#${p}a)"/>
  <text x="70" y="101" text-anchor="middle" font-size="80" font-weight="900" font-family='${H}' fill="#fff">追</text>
  <circle cx="106" cy="38" r="13" fill="#FFC21A"/><circle cx="106" cy="38" r="5.5" fill="#fff"/><circle cx="101" cy="33" r="3" fill="#fff" opacity=".7"/></svg>`},
 {n:'字母 C',d:'Cue 首字母，缺口处一颗球滚出，有动感',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <rect width="144" height="144" fill="#FFC53D"/>
  <path d="M98 46A38 38 0 1 0 98 98" fill="none" stroke="#16161A" stroke-width="22" stroke-linecap="round"/>
  <circle cx="110" cy="72" r="14" fill="#FF5A5F"/><circle cx="105.5" cy="67" r="4" fill="#fff" opacity=".85"/></svg>`},
 {n:'极简线条',d:'球杆击球的线稿，安静、克制、偏高级',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <rect width="144" height="144" fill="#F6F4F0"/>
  <line x1="26" y1="30" x2="60" y2="58" stroke="#16161A" stroke-width="7" stroke-linecap="round"/>
  <line x1="60" y1="58" x2="66" y2="63" stroke="#3D7BFF" stroke-width="7" stroke-linecap="round"/>
  <circle cx="90" cy="88" r="25" fill="none" stroke="#16161A" stroke-width="6"/>
  <circle cx="90" cy="88" r="9" fill="#FF5A5F"/>
  <path d="M72 108l-8 8M84 116l-3 10M62 96l-11 3" stroke="#16161A" stroke-width="4" stroke-linecap="round" opacity=".35"/></svg>`},
 {n:'计分数字',d:'「+4」直接表达加分，记分工具属性最强',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <rect width="144" height="144" fill="#16161A"/>
  <text x="70" y="94" text-anchor="middle" font-size="70" font-weight="900" font-family='${R}' letter-spacing="-3"><tspan fill="#FF5A5F">+</tspan><tspan fill="#FFC53D">4</tspan></text>
  <circle cx="52" cy="112" r="5" fill="#3D7BFF"/><circle cx="72" cy="112" r="5" fill="#1FC98E"/><circle cx="92" cy="112" r="5" fill="#FF5A5F"/></svg>`},
 {n:'孟菲斯',d:'波浪线、三角、圆点拼贴，年轻潮流',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <rect width="144" height="144" fill="#9B6BFF"/>
  ${[0,1,2,3].map(i=>[0,1,2,3].map(j=>`<circle cx="${18+i*9}" cy="${100+j*9}" r="2" fill="#fff" opacity=".55"/>`).join('')).join('')}
  <path d="M86 28q8-8 16 0t16 0" fill="none" stroke="#FFC53D" stroke-width="6" stroke-linecap="round"/>
  <path d="M28 40l16-6-4 17z" fill="#1FC98E"/><circle cx="114" cy="108" r="9" fill="#3D7BFF"/>
  <circle cx="72" cy="74" r="32" fill="#FF5A5F"/><circle cx="72" cy="74" r="13" fill="#fff"/>
  <text x="72" y="80.5" text-anchor="middle" font-size="17" font-weight="900" font-family='${R}' fill="#16161A">9</text>
  <path d="M92 104l14 6" stroke="#16161A" stroke-width="5" stroke-linecap="round"/></svg>`},
 {n:'像素风',d:'8-bit 像素九号球，复古游戏感',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="144" height="144" fill="#1FC98E"/><rect y="120" width="144" height="24" fill="#17B07B"/>
  ${pixelBall()}</svg>`},
 {n:'霓虹夜场',d:'球房夜场霓虹灯牌，深色背景下很醒目',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg"><defs>
  <filter id="${p}g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="144" height="144" fill="#0E0E16"/>
  <g filter="url(#${p}g)"><circle cx="72" cy="72" r="40" fill="none" stroke="#FF4FD8" stroke-width="5"/>
  <text x="72" y="90" text-anchor="middle" font-size="50" font-weight="700" font-family='${R}' fill="none" stroke="#3EE8FF" stroke-width="2.6">9</text></g></svg>`},
 {n:'贴纸',d:'白描边贴纸 + 轻微倾斜，俏皮有亲和力',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg"><defs>
  <filter id="${p}s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0B2A7A" flood-opacity=".35"/></filter></defs>
  <rect width="144" height="144" fill="#3D7BFF"/>
  <g transform="rotate(-9 72 72)" filter="url(#${p}s)"><rect x="26" y="30" width="92" height="84" rx="30" fill="#fff"/>
  <rect x="33" y="37" width="78" height="70" rx="24" fill="#FF5A5F"/>
  <text x="72" y="86" text-anchor="middle" font-size="40" font-weight="900" font-family='${H}' fill="#fff">追分</text></g>
  <path d="M112 30l3.5 7.5 8 1-6 5.5 1.5 8-7-4-7 4 1.5-8-6-5.5 8-1z" fill="#FFC53D"/></svg>`},
 {n:'液态玻璃',d:'彩色光斑上的玻璃球，延续 iOS 液态玻璃质感',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg"><defs>
  <filter id="${p}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="${p}r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient></defs>
  <rect width="144" height="144" fill="#5B5CFF"/>
  <g filter="url(#${p}b)"><circle cx="30" cy="34" r="40" fill="#FF5A5F"/><circle cx="118" cy="40" r="34" fill="#FFC53D"/><circle cx="104" cy="118" r="40" fill="#1FC98E"/><circle cx="26" cy="120" r="30" fill="#3D7BFF"/></g>
  <circle cx="72" cy="72" r="42" fill="#fff" fill-opacity=".22" stroke="url(#${p}r)" stroke-width="2.5"/>
  <ellipse cx="58" cy="50" rx="18" ry="8" fill="#fff" opacity=".55" transform="rotate(-28 58 50)"/>
  <text x="72" y="89" text-anchor="middle" font-size="48" font-weight="900" font-family='${R}' fill="#fff">9</text></svg>`},
 {n:'叠球（首页同款）',d:'与首页模式卡片同一套叠色圆形，品牌一致性最好',svg:p=>`<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <rect width="144" height="144" fill="#FF5A5F"/>
  <circle cx="92" cy="54" r="34" fill="#FFC53D"/><circle cx="60" cy="66" r="26" fill="#3D7BFF" style="mix-blend-mode:multiply" opacity=".92"/>
  <circle cx="96" cy="94" r="14" fill="#1FC98E"/>
  <text x="72" y="118" text-anchor="middle" font-size="26" font-weight="900" font-family='${R}' fill="#fff" letter-spacing=".5">Cue</text></svg>`}
];
const q=new URLSearchParams(location.search);
if(q.has('export')){document.body.classList.add('export');const i=+q.get('export');document.getElementById('exp').innerHTML=LOGOS[i].svg('x'+i);}
else{
  document.getElementById('grid').innerHTML=LOGOS.map((L,i)=>`<div class="card"><div class="top"><i>${String(i+1).padStart(2,'0')}</i><b>${L.n}</b></div><div class="desc">${L.d}</div>
    <div class="pv"><div class="sq">${L.svg('s'+i)}</div><div class="side"><div class="ci">${L.svg('c'+i)}</div><small>圆形</small><div class="mi">${L.svg('m'+i)}</div><small>32px</small></div></div>
    <button class="dl" data-i="${i}">下载 PNG · 144×144</button></div>`).join('');
  const row=(id,pre)=>document.getElementById(id).innerHTML=LOGOS.map((L,i)=>`<div class="rw"><div class="row">${L.svg(pre+i)}</div>${String(i+1).padStart(2,'0')}</div>`).join('');
  row('rows','r');row('rowsD','d');
  document.querySelectorAll('.dl').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,svg=LOGOS[i].svg('p'+i);
    const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=144;c.getContext('2d').drawImage(img,0,0,144,144);
      const a=document.createElement('a');a.download=`cue-avatar-${String(i+1).padStart(2,'0')}.png`;a.href=c.toDataURL('image/png');a.click()};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
}
</script>
</body>
</html>
